services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oxxx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: oxxx
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxxx -d oxxx"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - oxxx_pg:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oxxx:${POSTGRES_PASSWORD}@postgres:5432/oxxx
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?ADMIN_TOTP_SECRET is required}
      ADMIN_CONSOLE_ORIGIN: ${ADMIN_CONSOLE_ORIGIN:-}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-http://localhost:3000}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      # Local compose runs NODE_ENV=production. Set a real CIDR list and "false" outside this machine.
      ADMIN_IP_ALLOWLIST_DISABLED: ${ADMIN_IP_ALLOWLIST_DISABLED:-true}
      STORAGE_DRIVER: local
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      PRESALE_ALERT_CHANNELS: log
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  indexer:
    profiles: ["indexer"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oxxx:${POSTGRES_PASSWORD}@postgres:5432/oxxx
      NODE_ENV: production
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      PRESALE_ALERT_CHANNELS: log
    command:
      [
        "sh",
        "-c",
        "cd /app/backend && ./node_modules/.bin/prisma migrate deploy --schema /app/prisma/schema.prisma && exec ./node_modules/.bin/tsx src/scripts/presale-worker.ts",
      ]
    restart: unless-stopped

volumes:
  oxxx_pg:
